<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roots &amp; Affixes — A Word-Builder Notebook</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>R</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">

<style>
/* ================================================================
   [RESET]
   ================================================================ */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ================================================================
   [COLORS] — Deep Teal + Warm White
   ================================================================ */
:root{
  --bg:        #00859F;
  --bg-dark:   #006476;
  --bg-deeper: #005468;
  --warm:      #F8F4E9;
  --warm-dim:  rgba(248,244,233,0.72);
  --warm-muted:rgba(248,244,233,0.45);
  --warm-faint:rgba(248,244,233,0.18);
  --accent:    #4ECDC4;

  --glass-bg:       rgba(248,244,233,0.09);
  --glass-bg-hover: rgba(248,244,233,0.16);
  --glass-border:   rgba(248,244,233,0.16);
  --glass-shine:    rgba(255,255,255,0.12);

  --radius: 20px;
  --radius-sm: 14px;
}

html{background:var(--bg);}

body{
  min-height:100vh;
  font-family:'Inter',-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--warm);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;

  background:
    radial-gradient(ellipse 80% 55% at 25% 25%, rgba(255,255,255,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 70% 65%, rgba(0,0,0,0.10) 0%, transparent 55%),
    linear-gradient(172deg, var(--bg) 0%, var(--bg-dark) 100%);
  background-attachment:fixed;
}

/* ================================================================
   [NOISE TEXTURE]
   ================================================================ */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.022;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}

/* ================================================================
   [BG ORBS]
   ================================================================ */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.2;}
.orb-1{
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(255,255,255,0.5),transparent);
  top:-20%;left:-15%;
}
.orb-2{
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(248,244,233,0.35),transparent);
  bottom:-15%;right:-10%;
}

/* ================================================================
   [MAIN]
   ================================================================ */
.main{
  position:relative;z-index:1;
  max-width:1040px;margin:0 auto;padding:44px 24px 80px;
}

/* ================================================================
   [SHINY GRADIENT TEXT — Title]
   ================================================================ */
.shiny-title{
  font-family:'Cochin','Georgia','Times New Roman',serif;
  font-size:clamp(38px,6.5vw,64px);font-weight:700;
  letter-spacing:0.02em;line-height:1.1;
  text-align:center;

  background-image:linear-gradient(to right,
    #F8F4E9 0%,
    #B8F0EC 15%,
    #F8F4E9 32%,
    #FFFFFF 50%,
    #F8F4E9 68%,
    #B8F0EC 85%,
    #F8F4E9 100%
  );
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  animation:shiny 7s linear infinite;
}

@keyframes shiny{
  0%{background-position:-200% center;}
  100%{background-position:200% center;}
}

/* ================================================================
   [HEADER]
   ================================================================ */
.header{
  text-align:center;padding:36px 0 36px;
}
.header .subtitle{
  font-family:'Snell Roundhand','Apple Chancery','Comic Sans MS',cursive;
  font-size:clamp(14px,1.8vw,18px);color:var(--warm-dim);
  margin-top:12px;font-weight:500;letter-spacing:0.03em;
}
.stats-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:20px;flex-wrap:wrap;
}
.stat-chip{
  font-family:'Inter',sans-serif;font-size:12px;font-weight:600;
  color:var(--warm-dim);
  background:var(--glass-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:6px 16px;border-radius:20px;
  border:0.5px solid var(--glass-border);
  letter-spacing:0.04em;
}
.stat-chip strong{color:var(--warm);font-weight:700;}

/* ================================================================
   [SEARCH] — Liquid glass pill
   ================================================================ */
.search-wrap{display:flex;justify-content:center;margin-bottom:22px;}
.search-glass{
  width:100%;max-width:480px;position:relative;
  background:var(--glass-bg);
  backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);
  border-radius:40px;padding:3px;
  border:0.5px solid var(--glass-border);
  box-shadow:
    0 2px 16px rgba(0,0,0,0.06),
    inset 0 0 0 1px rgba(255,255,255,0.07);
  transition:border-color 0.3s ease,box-shadow 0.3s ease;
}
.search-glass:focus-within{
  border-color:rgba(248,244,233,0.32);
  box-shadow:
    0 4px 24px rgba(0,0,0,0.1),
    inset 0 0 0 1px rgba(255,255,255,0.12),
    0 0 0 4px rgba(248,244,233,0.05);
}
.search-glass input{
  width:100%;border:none;outline:none;background:transparent;
  padding:14px 46px 14px 20px;
  font-size:14px;font-family:'Inter',sans-serif;font-weight:500;
  color:var(--warm);
}
.search-glass input::placeholder{color:var(--warm-muted);font-weight:400;}

.search-icon-svg{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  pointer-events:none;opacity:0.4;
}
.search-icon-svg svg{display:block;}

/* ================================================================
   [A-Z BAR]
   ================================================================ */
.az-bar-wrap{display:flex;justify-content:center;margin-bottom:30px;}
.az-bar{
  display:flex;gap:3px;flex-wrap:wrap;justify-content:center;
  max-width:660px;
}
.az-btn{
  font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
  width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;
  background:var(--glass-bg);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--warm-dim);
  border:0.5px solid var(--glass-border);
  transition:all 0.2s ease;
  display:flex;align-items:center;justify-content:center;
}
.az-btn:hover{
  background:var(--glass-bg-hover);
  border-color:rgba(248,244,233,0.28);
  color:var(--warm);
  transform:translateY(-1px);
}
.az-btn.active{
  background:rgba(248,244,233,0.22);
  color:var(--warm);
  border-color:rgba(248,244,233,0.4);
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
}
.az-btn.all-btn{
  width:auto;padding:0 13px;border-radius:15px;font-size:10px;
  letter-spacing:0.06em;font-weight:700;
}
.az-btn.empty-letter{opacity:0.28;cursor:default;}
.az-btn.empty-letter:hover{
  background:var(--glass-bg);
  border-color:var(--glass-border);
  color:var(--warm-dim);
  transform:none;
}

/* ================================================================
   [CARD GRID]
   ================================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
}

/* ================================================================
   [GLASS CARD]
   ================================================================ */
.glass-card{
  position:relative;
  background:var(--glass-bg);
  backdrop-filter:blur(14px) saturate(1.15);
  -webkit-backdrop-filter:blur(14px) saturate(1.15);
  border-radius:var(--radius);
  padding:26px 24px 22px;
  border:0.5px solid var(--glass-border);
  box-shadow:
    0 2px 12px rgba(0,0,0,0.04),
    inset 0 0 0 1px rgba(255,255,255,0.07);
  transition:transform 0.3s ease,box-shadow 0.3s ease,border-color 0.3s ease;
  overflow:hidden;
  cursor:pointer;
}
.glass-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 8px 28px rgba(0,0,0,0.12),
    inset 0 0 0 1px rgba(255,255,255,0.12);
  border-color:rgba(248,244,233,0.32);
}

/* ── Specular shine ── */
.glass-card::before{
  content:'';position:absolute;z-index:2;pointer-events:none;
  inset:0;border-radius:var(--radius);
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.16) 0%,
    rgba(255,255,255,0.08) 22%,
    transparent 48%,
    transparent 70%,
    rgba(0,0,0,0.03) 100%
  );
}

/* ── Mouse highlight ── */
.glass-card::after{
  content:'';position:absolute;z-index:3;pointer-events:none;
  inset:0;border-radius:var(--radius);
  opacity:0;transition:opacity 0.3s ease;
  background:radial-gradient(circle 180px at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.20) 0%, transparent 100%);
}
.glass-card:hover::after{opacity:1;}

.glass-card > *{position:relative;z-index:4;}

/* ── Card typography ── */
.card-root{
  font-family:'Big Caslon','Playfair Display','Georgia',serif;
  font-size:clamp(24px,3vw,32px);font-weight:500;
  letter-spacing:0.01em;line-height:1.15;color:var(--warm);
  margin-bottom:6px;word-break:break-all;
}
.card-meaning{
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;color:var(--warm-dim);
  margin-bottom:4px;
}
.card-notes{
  font-family:'Inter',sans-serif;
  font-size:12px;color:var(--warm-muted);line-height:1.55;
  margin-bottom:12px;font-style:italic;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.card-examples{
  display:flex;flex-wrap:wrap;gap:5px;
}
.card-examples .ex-word{
  font-family:'Inter',sans-serif;
  font-size:12px;font-weight:600;color:var(--warm-dim);
  background:rgba(248,244,233,0.07);
  padding:4px 10px;border-radius:12px;
  border:0.5px solid rgba(248,244,233,0.10);
  transition:all 0.2s ease;
}
.card-examples .ex-word:hover{
  background:rgba(248,244,233,0.16);
  border-color:rgba(248,244,233,0.22);
}
.card-examples .ex-word.matched{
  background:rgba(78,205,196,0.18);
  border-color:rgba(78,205,196,0.35);
  color:#B8F0EC;
}
.card-word-match{
  font-family:'Inter',sans-serif;
  font-size:10px;font-weight:600;color:#B8F0EC;
  margin-top:8px;letter-spacing:0.03em;
}

.card-expand-hint{
  position:absolute;bottom:10px;right:14px;z-index:5;
  font-family:'Inter',sans-serif;font-size:10px;font-weight:600;
  color:var(--warm-muted);opacity:0;
  transition:opacity 0.25s ease;letter-spacing:0.05em;
}
.glass-card:hover .card-expand-hint{opacity:0.6;}

/* ================================================================
   [EMPTY STATE]
   ================================================================ */
.empty-state{
  grid-column:1/-1;text-align:center;padding:64px 20px;
}
.empty-state .empty-icon{
  width:56px;height:56px;margin:0 auto 20px;opacity:0.3;
  border-radius:50%;
  background:var(--glass-bg);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:0.5px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
}
.empty-state .empty-icon svg{opacity:0.55;}
.empty-state .empty-title{
  font-family:'Playfair Display','Georgia',serif;
  font-size:19px;font-weight:700;color:var(--warm-dim);
  margin-bottom:8px;
}
.empty-state .empty-desc{
  font-family:'Inter',sans-serif;font-size:13px;color:var(--warm-muted);
  line-height:1.65;max-width:380px;margin:0 auto;
}

/* ================================================================
   [MODAL]
   ================================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,50,60,0.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity 0.3s ease;
}
.modal-overlay.open{opacity:1;pointer-events:auto;}

.modal-card{
  position:relative;
  background:rgba(248,244,233,0.10);
  backdrop-filter:blur(20px) saturate(1.2);
  -webkit-backdrop-filter:blur(20px) saturate(1.2);
  border-radius:24px;
  padding:40px 36px 32px;
  max-width:500px;width:100%;max-height:85vh;overflow-y:auto;
  border:0.5px solid rgba(248,244,233,0.22);
  box-shadow:
    0 8px 40px rgba(0,0,0,0.18),
    inset 0 0 0 1px rgba(255,255,255,0.08);
  transform:translateY(12px) scale(0.96);
  transition:transform 0.35s cubic-bezier(0.22,0.61,0.36,1);
}
.modal-overlay.open .modal-card{
  transform:translateY(0) scale(1);
}

.modal-card::before{
  content:'';position:absolute;z-index:2;pointer-events:none;
  inset:0;border-radius:24px;
  background:linear-gradient(
    135deg,
    rgba(255,255,255,0.18) 0%,
    rgba(255,255,255,0.08) 20%,
    transparent 50%,
    transparent 70%,
    rgba(0,0,0,0.03) 100%
  );
}
.modal-card > *{position:relative;z-index:4;}

.modal-close{
  position:absolute;top:14px;right:16px;z-index:10;
  width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(248,244,233,0.10);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:0.5px solid rgba(248,244,233,0.18);
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s ease;
}
.modal-close:hover{
  background:rgba(248,244,233,0.20);
  border-color:rgba(248,244,233,0.32);
}
.modal-close::before,.modal-close::after{
  content:'';position:absolute;
  width:13px;height:1.5px;background:var(--warm);border-radius:1px;
}
.modal-close::before{transform:rotate(45deg);}
.modal-close::after{transform:rotate(-45deg);}

.modal-root{
  font-family:'Big Caslon','Playfair Display','Georgia',serif;
  font-size:clamp(32px,5vw,46px);font-weight:500;
  letter-spacing:0.01em;line-height:1.1;color:var(--warm);
  margin-bottom:8px;word-break:break-all;
}
.modal-meaning{
  font-family:'Inter',sans-serif;
  font-size:16px;font-weight:600;color:var(--warm-dim);
  margin-bottom:14px;
}
.modal-notes{
  font-family:'Inter',sans-serif;
  font-size:13px;color:var(--warm-dim);line-height:1.7;
  margin-bottom:20px;font-style:italic;
  padding:15px 18px;
  background:rgba(248,244,233,0.05);
  border-radius:var(--radius-sm);
  border:0.5px solid rgba(248,244,233,0.07);
}
.modal-section-label{
  font-family:'Inter',sans-serif;
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.1em;color:var(--warm-muted);margin-bottom:10px;
}
.modal-examples{
  display:flex;flex-wrap:wrap;gap:8px;
}
.modal-examples .ex-word{
  font-family:'Inter',sans-serif;
  font-size:13px;font-weight:600;color:var(--warm-dim);
  background:rgba(248,244,233,0.08);
  padding:6px 14px;border-radius:14px;
  border:0.5px solid rgba(248,244,233,0.12);
  cursor:pointer;
  transition:all 0.2s ease;
}
.modal-examples .ex-word:hover{
  background:rgba(248,244,233,0.18);
  border-color:rgba(248,244,233,0.28);
}
.modal-examples .ex-word.selected{
  background:rgba(78,205,196,0.22);
  border-color:rgba(78,205,196,0.45);
  color:#B8F0EC;
}
.modal-examples .ex-word.matched{
  background:rgba(78,205,196,0.18);
  border-color:rgba(78,205,196,0.35);
  color:#B8F0EC;
}
.modal-letter{
  display:inline-block;margin-top:20px;
  font-family:'Inter',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:0.1em;
  text-transform:uppercase;
  color:var(--warm-muted);
  background:rgba(248,244,233,0.06);
  padding:5px 12px;border-radius:12px;
}

/* ── Word detail panel (in modal) ── */
.word-detail{
  margin-top:16px;padding:16px 18px;
  background:rgba(248,244,233,0.06);
  border-radius:var(--radius-sm);
  border:0.5px solid rgba(248,244,233,0.10);
  display:none;
}
.word-detail.open{display:block;}
.word-detail-pron{
  font-family:'Inter',sans-serif;
  font-size:14px;font-weight:600;color:var(--accent);
  margin-bottom:10px;line-height:1.7;
}
.pron-label{
  display:inline-block;width:22px;
  font-size:9px;font-weight:800;letter-spacing:0.08em;
  color:var(--warm-muted);
}
.word-detail-row{
  margin-bottom:10px;
}
.word-detail-label{
  font-size:9px;font-weight:800;text-transform:uppercase;
  letter-spacing:0.1em;color:var(--warm-muted);
  margin-bottom:3px;
}
.word-detail-text{
  font-family:'Inter',sans-serif;
  font-size:13px;color:var(--warm-dim);line-height:1.6;
}
.word-detail-text em{color:var(--warm);font-style:italic;}

/* ================================================================
   [FOOTER]
   ================================================================ */
.footer{
  text-align:center;padding:36px 20px;
  position:relative;z-index:1;
  font-family:'Inter',sans-serif;
  font-size:11px;font-weight:500;color:var(--warm-muted);
  letter-spacing:0.05em;
}
.footer span{color:var(--warm-dim);}

/* ================================================================
   [RESPONSIVE]
   ================================================================ */
@media(max-width:640px){
  .grid{grid-template-columns:1fr;gap:14px;}
  .main{padding:24px 16px 60px;}
  .header{padding:24px 0 20px;}
  .glass-card{padding:22px 20px 18px;}
  .modal-card{padding:28px 22px 24px;}
  .az-btn{width:27px;height:27px;font-size:10px;}
  .az-bar{gap:2px;}
  .shiny-title{font-size:clamp(30px,8vw,44px);}
}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- MAIN -->
<!-- ══════════════════════════════════════════════════ -->
<div class="main">

  <header class="header">
    <h1 class="shiny-title">Roots &amp; Affixes</h1>
    <p class="subtitle">A Word-Builder Notebook &mdash; from Merriam-Webster Vocabulary Builder</p>
    <div class="stats-row">
      <span class="stat-chip">Total:&nbsp;<strong id="countNum">0</strong></span>
      <span class="stat-chip" id="letterChip" style="display:none">Letter:&nbsp;<strong id="letterLabel"></strong></span>
    </div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-glass">
      <input type="text" id="searchInput" placeholder="Search roots, meanings, or any word from the book&hellip;" autocomplete="off">
      <span class="search-icon-svg">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(248,244,233,0.45)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
    </div>
  </div>

  <!-- A-Z Bar -->
  <div class="az-bar-wrap">
    <div class="az-bar" id="azBar">
      <button class="az-btn all-btn active" data-letter="all">ALL</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid" id="grid"></div>

</div>

<footer class="footer">
  A word-builder notebook &mdash; one root at a time &middot; <span>AndDream</span>
</footer>

<!-- ══════════════════════════════════════════════════ -->
<!-- MODAL -->
<!-- ══════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Close"></button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════ -->
<!-- SCRIPTS -->
<!-- ══════════════════════════════════════════════════ -->
<script>
/* ───────────────────────────────────────
   [DATA]
   Add entries as you learn them.
   { root, meaning, examples[], notes?, words[]? }
   - examples: short display words shown on card
   - words: full vocabulary list from the book (searchable)
   ─────────────────────────────────────── */
const WORD_DATA = [{
    root: "BENE",
    meaning: "well, good",
    examples: ["benefit", "beneficial", "benevolent"],
    words: ["benediction", "benefactor", "beneficiary", "benevolence"],
    notes: "Latin bene = well. A benefit is a good result or effect. Something beneficial produces good results or effects.",
    wordDetails: {
      "benefit": {
        pronunciationUS: "/ˈbɛn.əˌfɪt/",

        usage: "From Latin benefactum (\"good deed\"). Benefit is the most common English word derived from the BENE root. It functions as both a noun and a verb."

      "beneficial": {

        pronunciationUK: "/ˌbɛn.ɪˈfɪʃ.əl/",

        example: "Regular exercise is highly beneficial to your overall health.",
        usage: "From Latin beneficium (\"benefit, favor\"). Often used in formal contexts to describe something that has a positive effect."
      },
      "benevolent": {
        pronunciationUS: "/bəˈnɛv.ə.lənt/",
        pronunciationUK: "/bəˈnɛv.ə.lənt/",
        definition: "Well-meaning and kindly; characterized by goodwill.",
        example: "The benevolent donor funded scholarships for dozens of underprivileged students.",
        usage: "From Latin bene volens (\"well-wishing\"). Describes a person or organization disposed to doing good."
      },
      "benediction": {
        pronunciationUS: "/ˌbɛn.əˈdɪk.ʃən/",
        pronunciationUK: "/ˌbɛn.ɪˈdɪk.ʃən/",
        definition: "A prayer that asks for God's blessing, especially a prayer that concludes a worship service.",
        example: "The moment the bishop had finished his benediction, she squeezed quickly out of her row and darted out the cathedral's side entrance.",
        usage: "In benediction, the bene root is joined by another Latin root, dictio (\"speaking\"), so the word's meaning becomes \"well-wishing.\" The best-known benediction is the Aaronic Benediction: \"May the Lord bless you and keep you.\""
      },
      "benefactor": {
        pronunciationUS: "/ˈbɛn.əˌfæk.tɚ/",
        pronunciationUK: "/ˈbɛn.əˌfæk.tə/",
        definition: "Someone who helps another person or group, especially by giving money.",
        example: "An anonymous benefactor had given $15 million to establish an ecological institute at the university.",
        usage: "A benefactor may operate in almost any field. One may endow a scholarship fund; another may give money to expand a library. The famous benefactions of John D. Rockefeller included the gifts that established the University of Chicago and Rockefeller University."
      },
      "beneficiary": {
        pronunciationUS: "/ˌbɛn.əˈfɪʃ.iˌɛɹ.i/",
        pronunciationUK: "/ˌbɛn.ɪˈfɪʃ.əɹ.i/",
        definition: "A person or organization that benefits or is expected to benefit from something, especially one that receives money or property when someone dies.",
        example: "Living in a trailer in near-poverty, she received word in the mail that her father had died, naming her as the sole beneficiary of his life-insurance policy.",
        usage: "Beneficiary is often used in connection with life insurance, but it appears in many other contexts. A college may be the beneficiary of a private donation; a church may be the sole beneficiary of a will."
      },
      "benevolence": {
        pronunciationUS: "/bəˈnɛv.ə.ləns/",
        pronunciationUK: "/bəˈnɛv.ə.ləns/",
        definition: "Kindness, generosity.",
        example: "In those financially desperate years, the young couple was saved only by the benevolence of her elderly great-uncle.",
        usage: "Part of benevolence comes from the Latin root meaning \"wish.\" The novels of Charles Dickens often include a benevolent figure who rescues the main characters — Mr. Brownlow in Oliver Twist, Abel Magwitch in Great Expectations, and Mr. Jarndyce in Bleak House."
      }
    }
  }];

/* ───────────────────────────────────────
   [STATE]
   ─────────────────────────────────────── */
let activeLetter = 'all';
let searchQuery = '';

/* ───────────────────────────────────────
   [A-Z BAR]
   ─────────────────────────────────────── */
const azBar = document.getElementById('azBar');
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

LETTERS.forEach(letter => {
  const btn = document.createElement('button');
  btn.className = 'az-btn';
  btn.dataset.letter = letter;
  btn.textContent = letter;
  azBar.appendChild(btn);
});

function updateAZState(){
  azBar.querySelectorAll('.az-btn:not(.all-btn)').forEach(btn => {
    const letter = btn.dataset.letter;
    const has = WORD_DATA.some(e => e.root.charAt(0).toUpperCase() === letter);
    btn.classList.toggle('empty-letter', !has);
  });
}

/* ───────────────────────────────────────
   [RENDER]
   ─────────────────────────────────────── */
const grid = document.getElementById('grid');
const countNum = document.getElementById('countNum');
const letterChip = document.getElementById('letterChip');
const letterLabel = document.getElementById('letterLabel');

function getFilteredData(){
  return WORD_DATA.filter(entry => {
    if(activeLetter !== 'all' && entry.root.charAt(0).toUpperCase() !== activeLetter) return false;
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      return (
        entry.root.toLowerCase().includes(q) ||
        entry.meaning.toLowerCase().includes(q) ||
        entry.examples.some(ex => ex.toLowerCase().includes(q)) ||
        (entry.notes && entry.notes.toLowerCase().includes(q)) ||
        (entry.words && entry.words.some(w => w.toLowerCase().includes(q)))
      );
    }
    return true;
  });
}

function renderCards(){
  const data = getFilteredData();
  countNum.textContent = data.length;

  if(activeLetter === 'all'){
    letterChip.style.display = 'none';
  } else {
    letterChip.style.display = '';
    letterLabel.textContent = activeLetter;
  }

  if(data.length === 0){
    const isEmpty = WORD_DATA.length === 0;
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(248,244,233,0.45)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="empty-title">${isEmpty ? 'No entries yet' : 'No matches found'}</div>
        <div class="empty-desc">${isEmpty ? 'Start adding word roots and affixes as you encounter them in your reading. Each entry will appear here as a glass card.' : 'Try a different letter or adjust your search.'}</div>
      </div>`;
    return;
  }

  grid.innerHTML = data.map((entry, idx) => {
    const q = searchQuery.toLowerCase();
    // Determine which words match (if any)
    const allWords = [...entry.examples, ...(entry.words || [])];
    const matchedWords = q ? allWords.filter(w => w.toLowerCase().includes(q)) : [];

    return `
    <div class="glass-card" data-index="${idx}">
      <div class="card-root">${esc(entry.root)}</div>
      <div class="card-meaning">${esc(entry.meaning)}</div>
      ${entry.notes ? `<div class="card-notes">${esc(entry.notes)}</div>` : ''}
      <div class="card-examples">
        ${entry.examples.map(ex => {
          const isMatch = matchedWords.some(mw => mw.toLowerCase() === ex.toLowerCase());
          return `<span class="ex-word${isMatch ? ' matched' : ''}">${esc(ex)}</span>`;
        }).join('')}
      </div>
      ${matchedWords.length > 0 ? `<div class="card-word-match">Matches: ${esc(matchedWords.slice(0,4).join(', '))}${matchedWords.length > 4 ? '...' : ''}</div>` : ''}
      <div class="card-expand-hint">click to expand</div>
    </div>
  `}).join('');

  bindMouseTracking();
  bindCardClicks();
}

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ───────────────────────────────────────
   [MOUSE HIGHLIGHT]
   ─────────────────────────────────────── */
function bindMouseTracking(){
  document.querySelectorAll('.glass-card').forEach(card => {
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', `${((e.clientX - r.left) / r.width * 100).toFixed(1)}%`);
      card.style.setProperty('--my', `${((e.clientY - r.top) / r.height * 100).toFixed(1)}%`);
    });
    card.addEventListener('mouseleave', () => {
      card.style.setProperty('--mx', '50%');
      card.style.setProperty('--my', '50%');
    });
  });
}

/* ───────────────────────────────────────
   [MODAL]
   ─────────────────────────────────────── */
const overlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');
const modalClose = document.getElementById('modalClose');
let currentModalEntry = null;  // track which entry is shown in modal

function bindCardClicks(){
  document.querySelectorAll('.glass-card').forEach(card => {
    card.addEventListener('click', () => {
      const entry = getFilteredData()[parseInt(card.dataset.index)];
      if(!entry) return;
      currentModalEntry = entry;
      renderModalContent(entry, null);
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
  });
}

function renderModalContent(entry, selectedWord){
  const q = searchQuery.toLowerCase();
  const allWords = [...entry.examples, ...(entry.words || [])];
  const matchedWords = q ? allWords.filter(w => w.toLowerCase().includes(q)) : [];

  const renderWord = (w, extraClass) => {
    const isMatch = matchedWords.some(mw => mw.toLowerCase() === w.toLowerCase());
    const isSelected = selectedWord && selectedWord.toLowerCase() === w.toLowerCase();
    const cls = ['ex-word'];
    if(isMatch) cls.push('matched');
    if(isSelected) cls.push('selected');
    return `<span class="${cls.join(' ')}" data-word="${esc(w)}">${esc(w)}</span>`;
  };

  const examplesHTML = entry.examples.map(w => renderWord(w)).join('');

  let extraWordsHTML = '';
  if(entry.words && entry.words.length > 0) {
    const extraWords = entry.words.filter(w => !entry.examples.some(ex => ex.toLowerCase() === w.toLowerCase()));
    if(extraWords.length > 0) {
      extraWordsHTML = `
        <div class="modal-section-label" style="margin-top:16px;">More Words</div>
        <div class="modal-examples">
          ${extraWords.map(w => renderWord(w)).join('')}
        </div>`;
    }
  }

  // Word detail panel
  let detailHTML = '';
  if(selectedWord && entry.wordDetails && entry.wordDetails[selectedWord]){
    const d = entry.wordDetails[selectedWord];
    detailHTML = `
      <div class="word-detail open" id="wordDetail">
        <div class="word-detail-pron">
          <span class="pron-label">US</span> ${esc(d.pronunciationUS)}<br>
          <span class="pron-label">UK</span> ${esc(d.pronunciationUK)}
        </div>
        <div class="word-detail-row">
          <div class="word-detail-label">Definition</div>
          <div class="word-detail-text">${esc(d.definition)}</div>
        </div>
        <div class="word-detail-row">
          <div class="word-detail-label">Example</div>
          <div class="word-detail-text"><em>${esc(d.example)}</em></div>
        </div>
        <div class="word-detail-row">
          <div class="word-detail-label">Usage &amp; Etymology</div>
          <div class="word-detail-text">${esc(d.usage)}</div>
        </div>
      </div>`;
  } else {
    detailHTML = `<div class="word-detail" id="wordDetail"></div>`;
  }

  modalContent.innerHTML = `
    <div class="modal-root">${esc(entry.root)}</div>
    <div class="modal-meaning">${esc(entry.meaning)}</div>
    ${entry.notes ? `<div class="modal-notes">${esc(entry.notes)}</div>` : ''}
    <div class="modal-section-label">Example Words</div>
    <div class="modal-examples">${examplesHTML}</div>
    ${extraWordsHTML}
    ${detailHTML}
    ${matchedWords.length > 0 ? `<div style="margin-top:14px;font-size:11px;font-weight:600;color:#B8F0EC;">Search matched: ${esc(matchedWords.slice(0,6).join(', '))}${matchedWords.length > 6 ? '...' : ''}</div>` : ''}
    <div class="modal-letter">Starts with &ldquo;${esc(entry.root.charAt(0).toUpperCase())}&rdquo;</div>
  `;

  // Bind word clicks
  modalContent.querySelectorAll('.ex-word').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const word = el.dataset.word;
      const currentlySelected = modalContent.querySelector('.ex-word.selected');

      if(currentlySelected && currentlySelected.dataset.word === word){
        // Deselect
        renderModalContent(entry, null);
      } else {
        // Select new word
        renderModalContent(entry, word);
      }
    });
  });
}

function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ───────────────────────────────────────
   [SEARCH]
   ─────────────────────────────────────── */
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderCards();
});

/* ───────────────────────────────────────
   [A-Z FILTER]
   ─────────────────────────────────────── */
azBar.addEventListener('click', e => {
  const btn = e.target.closest('.az-btn');
  if(!btn) return;
  azBar.querySelectorAll('.az-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeLetter = btn.dataset.letter;
  renderCards();
});

/* ───────────────────────────────────────
   [INIT]
   ─────────────────────────────────────── */
updateAZState();
renderCards();
</script>

</body>
</html>
